```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      transition: 0.4s;
    }

    /* Header */
    header {
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 15px;
    }

    /* Theme Button */
    #themeBtn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #222;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    #themeBtn:hover {
      transform: scale(1.05);
    }

    /* Gallery */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 30px;
      flex-wrap: wrap;
    }

    /* Product Card */
    .card {
      width: 280px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);

      /* Fade-in animation */
      opacity: 0;
      transform: translateY(30px);
      animation: fadeIn 1s forwards;
    }

    .card:nth-child(2) {
      animation-delay: 0.2s;
    }

    .card:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Product Image */
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: 0.4s;
    }

    /* Hover Effect */
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .card:hover img {
      transform: scale(1.08);
    }

    /* Card Content */
    .content {
      padding: 20px;
      text-align: center;
    }

    .content h2 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .buy-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    /* DARK MODE */
    body.dark {
      background: #121212;
      color: white;
    }

    body.dark .card {
      background: #1f1f1f;
    }

    body.dark #themeBtn {
      background: white;
      color: #222;
    }
  </style>
</head>

<body>

  <header>
    <h1>Our Products</h1>
    <button id="themeBtn">🌙 Dark Mode</button>
  </header>

  <section class="gallery">

    <!-- Product 1 -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Watch">

      <div class="content">
        <h2>Smart Watch</h2>
        <p class="price">$99</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones">

      <div class="content">
        <h2>Headphones</h2>
        <p class="price">$79</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

    <!-- Product 3 -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Sneakers">

      <div class="content">
        <h2>Sneakers</h2>
        <p class="price">$120</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

  </section>

  <script>
    const themeBtn = document.getElementById("themeBtn");

    themeBtn.addEventListener("click", function() {
      document.body.classList.toggle("dark");

      if (document.body.classList.contains("dark")) {
        themeBtn.textContent = "☀️ Light Mode";
      } else {
        themeBtn.textContent = "🌙 Dark Mode";
      }
    });
  </script>

</body>
</html>
```
